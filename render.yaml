# Render Blueprint: https://render.com/docs/blueprint-spec
# Python version comes from .python-version; production mode and the public URL are detected from Render.
services:
  - type: web
    name: oryne-api
    runtime: python
    plan: starter            # paid instance: the free tier sleeps, which would drop M-Pesa callbacks
    region: frankfurt
    buildCommand: pip install uv && uv sync --frozen --no-dev
    preDeployCommand: uv run --no-dev alembic upgrade head
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Supabase Session pooler URL
      - key: SUPABASE_URL
        sync: false          # https://<project-ref>.supabase.co
      - key: API_KEY_PEPPER
        generateValue: true
      - key: SUPABASE_SECRET_KEY
        sync: false          # sb_secret_... : creates merchant logins on approval
      - key: RESEND_API_KEY
        sync: false          # re_... : emails login details (optional)
